services:
  - type: web
    name: lendy-admin
    runtime: static
    rootDir: admin
    buildCommand: echo "No build required"
    staticPublishPath: .
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
  - type: web
    name: lendy-account-approval
    runtime: node
    plan: free
    rootDir: approval-server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: FIREBASE_PROJECT_ID
        value: borrowing-system-lendy
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
